<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Especialidades | Gestor de turnos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard_style.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <span>Gestor de turnos</span>
      <div>
        <button id="botonmenu" class="menu">&#9776;</button>
        <button id="logout">Cerrar Sesión</button>
      </div>
    </header>
    <nav id="sidebar">
      <ul>
        <li><a href="#">Panel</a></li>
        <li><a href="dashboard.html" aria-current="page">Especialidades</a></li>
      </ul>
    </nav>
    <main>
      <h1>Directorio de Especialidades</h1>
      <form id="specialties-search-form" role="search">
        <label for="specialties-search">Buscar especialidad por nombre</label>
        <input id="specialties-search" name="name" type="search" placeholder="Buscar especialidad...">
        <button type="submit" disabled>Buscar</button>
      </form>
      <p id="specialties-message" role="status" hidden></p>
      <table>
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Descripción</th>
          </tr>
        </thead>
        <tbody id="specialties-table-body"></tbody>
      </table>
    </main>
    <footer>Mi Aplicación &copy; 2024</footer>
  </div>
</body>
</html>
