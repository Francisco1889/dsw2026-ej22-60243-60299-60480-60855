<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Especialidades | Gestor de turnos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard_style.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <span>Portal Admin</span>
      <div>
        <button id="botonmenu" class="menu" type="button" aria-label="Abrir menú">&#9776;</button>
        <button id="logout">Cerrar Sesión</button>
      </div>
    </header>
    <nav id="sidebar">
      <ul>
        <li><a href="#">Panel Control</a></li>
        <li><a href="dashboard.html" aria-current="page">Especialidades</a></li>
      </ul>
    </nav>
    <main>
      <h1>Directorio de Especialidades</h1>
      <p class="page-description">Consultá las especialidades médicas disponibles.</p>
      <section class="specialties-panel" aria-label="Listado de especialidades">
        <form id="specialties-search-form" role="search">
          <label for="specialties-search">Buscar por nombre</label>
          <div class="search-controls">
            <input id="specialties-search" name="name" type="search" placeholder="Buscar especialidad...">
            <button type="submit" disabled>Buscar</button>
          </div>
        </form>
        <p id="specialties-message" role="status" hidden></p>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Descripción</th>
              </tr>
            </thead>
            <tbody id="specialties-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer>Gestor de turnos &copy; 2026</footer>
  </div>
</body>
</html>
