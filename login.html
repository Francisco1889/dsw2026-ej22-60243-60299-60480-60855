<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">

  <script src="login.js"></script>
</head>

<body>
  <div class="login-container">
    <form>
      <div id="textoInicial">
        <h2> Bienvenido de nuevo </h2>
        <p>Por favor, autentiquese para acceder al portal de proveedores</p>
      </div>
      <label for="username">Nombre de Usuario</label>
      <input type="text" id="username" name="username" required placeholder="Ingrese ID de admin">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="*******">

      <button id="botons" type="submit">Iniciar Sesión</button>
      <hr class="divisor">
      <div id="acceso-seguro-texto">
        <p><strong>Solo acceso seguro:</strong> Este sistema es para personal medico
          autorizado. Los intentos de acceso no autorizados son registrados y
          monitoreados para su cumplimiento.
        </p>
      </div>
    </form>
  </div>
</body>

</html>
